<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyring</title>
    <link rel="icon" href="keyring.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply a stored theme before the first paint, so dark-mode users never
      // see a flash of paper. The landing page reads and writes the same key.
      try {
        const theme = localStorage.getItem("keyring.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Icons: one sprite, referenced with <use href="#i-name">. Stroked, 24px grid. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m10 7 5 5-5 5" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6" /></symbol>
      <symbol id="i-building" viewBox="0 0 24 24">
        <path d="M4 21V5.5L12 3v18M12 21V8l8 2.5V21M2.5 21h19" />
        <path d="M7 8.5h2M7 12h2M7 15.5h2M15 13h2M15 16.5h2" />
      </symbol>
      <symbol id="i-home" viewBox="0 0 24 24">
        <path d="M4 11 12 4l8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" />
      </symbol>
      <symbol id="i-wrench" viewBox="0 0 24 24">
        <path
          d="M15.5 3.2a5 5 0 0 0-5.2 6.7L3.6 16.6a2 2 0 0 0 2.8 2.8l6.7-6.7a5 5 0 0 0 6.7-5.2l-3.1 3.1-2.8-.5-.5-2.8z"
        />
      </symbol>
      <symbol id="i-megaphone" viewBox="0 0 24 24">
        <path d="M3 10v4a1 1 0 0 0 1 1h3l8 5V4L7 9H4a1 1 0 0 0-1 1ZM19 9a4 4 0 0 1 0 6M8 15l1.5 5.5" />
      </symbol>
      <symbol id="i-receipt" viewBox="0 0 24 24">
        <path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3" />
      </symbol>
      <symbol id="i-card" viewBox="0 0 24 24">
        <rect x="3" y="5.5" width="18" height="13" rx="2" />
        <path d="M3 10h18M7 15h4" />
      </symbol>
      <symbol id="i-key" viewBox="0 0 24 24">
        <circle cx="8" cy="8" r="4.5" />
        <path d="M11.2 11.2 20 20M16 16l2-2M18.5 18.5l2-2" />
      </symbol>
      <symbol id="i-door" viewBox="0 0 24 24">
        <path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17M3 21h18M15 12h.01" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3.5" />
        <path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5" />
        <path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18.2 14.8c1.9.7 3 2.5 3.3 5.2" />
      </symbol>
      <symbol id="i-mail" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <path d="m3.5 6.5 8.5 7 8.5-7" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" />
      </symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8" /></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" />
        <path
          d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"
        />
      </symbol>
      <symbol id="i-phone" viewBox="0 0 24 24">
        <path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2" />
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 10v4.5M12 17.5h.01" /></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-7 18-4-7-7-4z" /></symbol>
      <symbol id="i-print" viewBox="0 0 24 24">
        <path d="M6 9V3h12v6M6 17H4v-6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6h-2M7 14h10v7H7z" />
      </symbol>
      <symbol id="i-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24">
        <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11" />
      </symbol>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" /></symbol>
      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z" /></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z" /></symbol>
      <symbol id="i-fridge" viewBox="0 0 24 24">
        <rect x="5" y="2.5" width="14" height="19" rx="2" />
        <path d="M5 10h14M9 6v1.5M9 13v3" />
      </symbol>
      <symbol id="i-flame" viewBox="0 0 24 24">
        <path d="M12 21a6 6 0 0 0 6-6c0-4-3-6-4-10-2 2-3 4-3 6-1-1-1.5-2-1.5-3C7 10 6 12.5 6 15a6 6 0 0 0 6 6Z" />
      </symbol>
      <symbol id="i-bug" viewBox="0 0 24 24">
        <rect x="7.5" y="7" width="9" height="13" rx="4.5" />
        <path
          d="M12 11v9M4 13h3.5M16.5 13H20M5 8l2.5 2M19 8l-2.5 2M5 19l2.5-2M19 19l-2.5-2M9.5 4.5 11 7M14.5 4.5 13 7"
        />
      </symbol>
    </svg>

    <header class="top" id="top">
      <a class="brand" href="#/" aria-label="Keyring home">
        <img class="brand__mark" src="keyring.svg" alt="" width="30" height="30" />
        <span class="brand__word">keyring</span>
      </a>
      <nav class="portals" id="portals" aria-label="Portal" hidden>
        <a class="portals__link" id="portal-l" href="#/l">Landlord</a>
        <a class="portals__link" id="portal-t" href="#/t">Tenant</a>
      </nav>
      <div class="top__end">
        <span class="livedot" id="livedot" title="Live updates" hidden></span>
        <button class="iconbtn iconbtn--top" id="theme" type="button" aria-label="Switch theme">
          <svg class="icon icon--sun"><use href="#i-sun" /></svg
          ><svg class="icon icon--moon"><use href="#i-moon" /></svg>
        </button>
        <div class="acct">
          <button
            class="acct__btn"
            id="acct-btn"
            type="button"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="acct-menu"
          >
            <span class="avatar" id="acct-avatar">?</span>
          </button>
          <div class="menu menu--right" id="acct-menu" role="menu" hidden>
            <div class="menu__head">
              <p class="menu__name" id="acct-name"></p>
              <p class="menu__sub" id="acct-email"></p>
              <p class="menu__plan" id="acct-plan"></p>
            </div>
            <button class="menu__item" id="acct-rename" type="button" role="menuitem">
              <svg class="icon"><use href="#i-pencil" /></svg> Change display name
            </button>
            <a class="menu__item" href="../" role="menuitem"
              ><svg class="icon"><use href="#i-key" /></svg> Keyring home page</a
            >
            <a class="menu__item" href="https://yard.sh/library/security" role="menuitem">
              <svg class="icon"><use href="#i-gear" /></svg> Connected apps
            </a>
            <a class="menu__item menu__item--quiet" href="../__yard/auth/logout?return=/" role="menuitem">
              <svg class="icon"><use href="#i-logout" /></svg> Log out
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Always on screen: Keyring is a template, and nothing in it charges anyone. -->
    <p class="demo" role="note">
      <strong>Demo project.</strong> Payments in Keyring are simulated with test cards. No real money moves.
    </p>

    <div class="banner" id="banner" hidden></div>

    <main class="main" id="view" tabindex="-1">
      <div class="loading" aria-label="Loading"><span></span><span></span><span></span></div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
